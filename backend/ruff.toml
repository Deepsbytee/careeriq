# Lint for real bugs (syntax errors, undefined names, unused imports/variables),
# not style preferences.
line-length = 120
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# conftest must set environment variables before importing the app.
"tests/conftest.py" = ["E402"]
